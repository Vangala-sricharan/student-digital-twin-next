<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Volumetric Violet Nebula Gradient -->
    <radialGradient id="nebulaVioletFold" cx="62%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.38" />
      <stop offset="25%" stop-color="#7e22ce" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#581c87" stop-opacity="0.16" />
      <stop offset="75%" stop-color="#312e81" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000207" stop-opacity="0" />
    </radialGradient>

    <!-- Upper-Right Cosmic Filament Arc -->
    <radialGradient id="nebulaRightFilament" cx="82%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.28" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#6b21a8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000207" stop-opacity="0" />
    </radialGradient>

    <!-- Lower Cosmic Shelf / Horizon Nebula Veil -->
    <radialGradient id="nebulaLowerShelf" cx="54%" cy="66%" r="50%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#581c87" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#3b0764" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000207" stop-opacity="0" />
    </radialGradient>

    <!-- Mid-Range Magenta Dust Cluster -->
    <radialGradient id="nebulaMagentaCluster" cx="44%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#86198f" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#4a044e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000207" stop-opacity="0" />
    </radialGradient>

    <!-- Fractal Cosmic Gas Cloud Filter (Multi-Octave Volumetric Gas) -->
    <filter id="cosmicCloudFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="5" result="noise" seed="88" />
      <feColorMatrix type="matrix" values="
        0.58 0    0    0 0.42
        0    0.14 0    0 0.08
        0    0    0.80 0 0.60
        0    0    0    0.40 0" in="noise" result="coloredCloud" />
      <feComposite operator="in" in="coloredCloud" in2="SourceGraphic" />
    </filter>

    <!-- Micro Cosmic Dust Filter -->
    <filter id="microDustFilter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.040" numOctaves="3" result="dust" seed="142" />
      <feColorMatrix type="matrix" values="
        0.7 0   0   0 0.3
        0   0.3 0   0 0.1
        0   0   0.9 0 0.7
        0   0   0   0.25 0" in="dust" result="coloredDust" />
      <feComposite operator="in" in="coloredDust" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Base Transparent Viewport Canvas -->
  <rect width="100%" height="100%" fill="#000207" fill-opacity="0" />

  <!-- Volumetric Gas Clouds -->
  <circle cx="1190" cy="486" r="620" fill="url(#nebulaVioletFold)" />
  <circle cx="1574" cy="345" r="500" fill="url(#nebulaRightFilament)" />
  <circle cx="1036" cy="712" r="540" fill="url(#nebulaLowerShelf)" />
  <circle cx="844" cy="561" r="420" fill="url(#nebulaMagentaCluster)" />

  <!-- Textured Gas Veil with Fractal Filter -->
  <path d="M 600,200 Q 950,150 1350,280 T 1850,450 L 1920,850 Q 1400,980 900,820 T 550,550 Z" 
        fill="#9333ea" 
        filter="url(#cosmicCloudFilter)" 
        opacity="0.45" />

  <path d="M 750,400 Q 1100,320 1500,420 T 1900,680 L 1800,950 Q 1300,900 850,750 Z" 
        fill="#c084fc" 
        filter="url(#microDustFilter)" 
        opacity="0.32" />

  <!-- Interstellar Gas Filaments (Curving purple light strands) -->
  <g stroke="url(#nebulaRightFilament)" stroke-width="2.5" fill="none" opacity="0.35">
    <path d="M 850,320 C 1050,360 1280,290 1550,380 S 1800,420 1900,460" />
    <path d="M 780,420 C 1000,470 1220,410 1480,500 S 1750,560 1880,620" stroke-width="1.8" />
    <path d="M 920,580 C 1140,640 1360,600 1620,700 S 1820,740 1920,780" stroke-width="2.0" opacity="0.28" />
  </g>

  <!-- Deep Space Purple Stardust Points -->
  <g fill="#f3e8ff" opacity="0.5">
    <circle cx="980" cy="280" r="1.4" />
    <circle cx="1070" cy="340" r="0.9" />
    <circle cx="1160" cy="290" r="1.6" />
    <circle cx="1240" cy="380" r="1.1" />
    <circle cx="1320" cy="310" r="1.3" />
    <circle cx="1420" cy="260" r="1.8" />
    <circle cx="1520" cy="340" r="1.0" />
    <circle cx="1610" cy="280" r="1.5" />
    <circle cx="1700" cy="370" r="0.9" />
    <circle cx="920" cy="460" r="1.2" />
    <circle cx="1010" cy="510" r="1.7" />
    <circle cx="1120" cy="470" r="0.8" />
    <circle cx="1210" cy="540" r="1.3" />
    <circle cx="1300" cy="490" r="1.5" />
    <circle cx="1400" cy="560" r="1.1" />
    <circle cx="1490" cy="500" r="1.6" />
    <circle cx="1580" cy="590" r="0.8" />
    <circle cx="1680" cy="520" r="1.4" />
    <circle cx="1780" cy="610" r="1.2" />
    <circle cx="860" cy="620" r="1.1" />
    <circle cx="950" cy="680" r="1.5" />
    <circle cx="1060" cy="630" r="0.9" />
    <circle cx="1150" cy="710" r="1.4" />
    <circle cx="1260" cy="660" r="1.8" />
    <circle cx="1360" cy="730" r="1.0" />
    <circle cx="1460" cy="680" r="1.5" />
    <circle cx="1560" cy="760" r="1.2" />
    <circle cx="1660" cy="700" r="0.9" />
  </g>
</svg>
