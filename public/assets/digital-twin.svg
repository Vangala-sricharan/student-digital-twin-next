  <!-- Trace 2: Forehead horizontal circuit -->
  <path
    d="M 95 220 L 255 220"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
  />
  <circle cx="255" cy="220" r="16" fill="url(#sdtLogoGrad)" stroke="#ffffff" stroke-width="12" />

  <!-- Trace 3: Mid-face horizontal circuit -->
  <path
    d="M 97 275 L 205 275"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
  />
  <circle cx="205" cy="275" r="16" fill="url(#sdtLogoGrad)" stroke="#ffffff" stroke-width="12" />

  <!-- Trace 4: Lower cheek/jaw horizontal circuit -->
  <path
    d="M 108 330 L 245 330"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
  />
  <circle cx="245" cy="330" r="16" fill="url(#sdtLogoGrad)" stroke="#ffffff" stroke-width="12" />

  <!-- Trace 5: Neck circuit - turns DOWN 90 degrees -->
  <path
    d="M 152 385 L 200 385 L 200 425"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
